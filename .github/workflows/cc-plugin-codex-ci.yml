name: cc-plugin-codex CI

on:
  pull_request:
    paths:
      - "plugins/cc-plugin-codex/**"
      - ".github/workflows/cc-plugin-codex-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "plugins/cc-plugin-codex/**"
      - ".github/workflows/cc-plugin-codex-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/cc-plugin-codex
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: plugins/cc-plugin-codex/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

  live-integration:
    name: Live Claude integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/cc-plugin-codex
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: plugins/cc-plugin-codex/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -q tests/test_integration.py
